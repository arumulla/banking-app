<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Application</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Digital Banking Dashboard</h1>
        <p>Spring Boot + REST API + Thymeleaf Banking Application</p>
    </header>

    <section class="hero">
        <div class="card">
            <h2>Create Customer</h2>
            <form id="customerForm">
                <input type="text" id="fullName" placeholder="Full name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="phone" placeholder="Phone" required>
                <button type="submit">Add Customer</button>
            </form>
        </div>

        <div class="card">
            <h2>Create Account</h2>
            <form id="accountForm">
                <input type="number" id="customerId" placeholder="Customer ID" required>
                <select id="accountType">
                    <option value="SAVINGS">Savings</option>
                    <option value="CHECKING">Checking</option>
                    <option value="CREDIT">Credit</option>
                </select>
                <input type="number" step="0.01" id="initialDeposit" placeholder="Initial Deposit" required>
                <button type="submit">Open Account</button>
            </form>
        </div>
    </section>

    <section class="grid">
        <div class="card">
            <h2>Customers</h2>
            <table>
                <thead>
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr>
                </thead>
                <tbody id="customerTableBody">
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.id}"></td>
                    <td th:text="${customer.fullName}"></td>
                    <td th:text="${customer.email}"></td>
                    <td th:text="${customer.phone}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Accounts</h2>
            <table>
                <thead>
                <tr><th>ID</th><th>Account #</th><th>Type</th><th>Balance</th></tr>
                </thead>
                <tbody id="accountTableBody">
                <tr th:each="account : ${accounts}">
                    <td th:text="${account.id}"></td>
                    <td th:text="${account.accountNumber}"></td>
                    <td th:text="${account.accountType}"></td>
                    <td th:text="${account.balance}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="hero">
        <div class="card">
            <h2>Deposit</h2>
            <form id="depositForm">
                <input type="number" id="depositAccountId" placeholder="Account ID" required>
                <input type="number" step="0.01" id="depositAmount" placeholder="Amount" required>
                <input type="text" id="depositDescription" placeholder="Description" required>
                <button type="submit">Deposit Money</button>
            </form>
        </div>

        <div class="card">
            <h2>Withdraw</h2>
            <form id="withdrawForm">
                <input type="number" id="withdrawAccountId" placeholder="Account ID" required>
                <input type="number" step="0.01" id="withdrawAmount" placeholder="Amount" required>
                <input type="text" id="withdrawDescription" placeholder="Description" required>
                <button type="submit">Withdraw Money</button>
            </form>
        </div>
    </section>

    <section class="card">
        <h2>Recent Transactions</h2>
        <div class="transaction-actions">
            <input type="number" id="transactionAccountId" placeholder="Enter Account ID">
            <button onclick="loadTransactions()">Load Transactions</button>
        </div>
        <table>
            <thead>
            <tr><th>ID</th><th>Type</th><th>Amount</th><th>Description</th><th>Time</th></tr>
            </thead>
            <tbody id="transactionTableBody"></tbody>
        </table>
    </section>
</div>
<script src="/js/app.js"></script>
</body>
</html>
